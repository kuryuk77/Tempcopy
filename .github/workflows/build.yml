name: Ekran Kesiti APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: APK derle
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: EkranKesiti-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Sürüm (Release) olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ekran-kesiti-v${{ github.run_number }}
          name: Ekran Kesiti ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: app/build/outputs/apk/release/*.apk
